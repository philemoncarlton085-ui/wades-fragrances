<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE WADES FRAGRANCES</title>

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #0a0a0a 70%);
  color: #f5f5f5;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: linear-gradient(135deg, #000, #1a1a1a, #2b2b2b);
  text-align: center;
  padding: 35px 20px;
  border-bottom: 2px solid gold;
  box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
}

header h1 {
  font-size: 52px;
  letter-spacing: 4px;
  margin: 0;

  background: linear-gradient(90deg, #FFD700, #fff3b0, #FFD700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 8px rgba(255,215,0,0.6),
    0 0 18px rgba(255,215,0,0.5),
    0 0 28px rgba(255,215,0,0.4);

  animation: glowPulse 2.5s infinite ease-in-out;
}

@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 0 10px gold); }
  50% { filter: drop-shadow(0 0 22px gold); }
}

header p {
  margin-top: 8px;
  color: #ccc;
  letter-spacing: 2px;
}

.container {
  padding: 20px;
}

input, select {
  padding: 12px;
  margin: 5px;
  border-radius: 25px;
  border: none;
  background: #1c1c1c;
  color: white;
  outline: none;
}

/* PRODUCTS */

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid rgba(255,215,0,0.2);
  transition: 0.3s;
  animation: fadeIn 0.4s ease;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(255,215,0,0.25);
}

.card h3 {
  color: gold;
}

.product-image{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid rgba(255,215,0,0.3);
  background:#000;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(15px);}
  to {opacity:1; transform: translateY(0);}
}

/* BUTTONS */

button {
  background: linear-gradient(90deg, gold, #ffd700);
  color: black;
  border: none;
  padding: 10px;
  border-radius: 25px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  font-weight: bold;
}

button:hover {
  transform: scale(1.03);
}

/* CART */

.cart {
  margin-top: 30px;
  padding: 20px;
  background: #1a1a1a;
  border-radius: 15px;
  border: 1px solid rgba(255,215,0,0.3);
}

/* ADMIN */

.admin {
  margin-top: 40px;
  background: #111;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid gold;
}

.orderBox {
  border: 1px solid rgba(255,215,0,0.3);
  padding: 10px;
  margin-top: 10px;
}

/* FLOATING CART */

.floating-cart {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: gold;
  color: black;
  padding: 15px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(255,215,0,0.5);
}

footer {
  text-align: center;
  padding: 20px;
  border-top: 1px solid gold;
  margin-top: 40px;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 28px;
    letter-spacing: 2px;
  }

  header {
    padding: 20px 10px;
  }

  .products {
    grid-template-columns: 1fr;
  }

  input, select {
    width: 100%;
    margin: 5px 0;
  }

}

</style>
</head>

<body>

<header>
  <h1>THE WADES FRAGRANCES</h1>
  <p>Luxury Beauty • Elegance • Style</p>
</header>

<div class="container">

<input id="search" placeholder="Search products...">

<select id="filter">
<option>All</option>
<option>Perfume</option>
<option>Wig</option>
<option>Bag</option>
<option>Lipstick</option>
<option>Lipgloss</option>
</select>

<div class="products" id="products"></div>

<div class="cart">

<h2>🛒 Cart</h2>

<div id="cart"></div>

<h3 id="total"></h3>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="location" placeholder="Delivery Location">

<button onclick="checkout()">Checkout (Mobile Money Simulation)</button>

<button onclick="whatsapp()">Order via WhatsApp</button>

</div>

<div class="admin">

<h2>📦 Admin Orders</h2>

<button onclick="loadOrders()">Refresh Orders</button>

<div id="orders"></div>

</div>

</div>

<div class="floating-cart" onclick="scrollToCart()">🛒</div>

<script>

/* PRODUCTS */

let products = [

/* PERFUMES */

{
id:1,
name:"Khamrah",
brand:"Lattafa",
category:"Perfume",
price:110000,
image:"images/khamrah.jpg"
},

{
id:2,
name:"Sauvage",
brand:"Dior",
category:"Perfume",
price:320000,
image:"images/sauvage.jpg"
},

{
id:3,
name:"9PM Elixir",
brand:"Afnan",
category:"Perfume",
price:130000,
image:"images/9pm-elixir.jpg"
},

{
id:4,
name:"Eros",
brand:"Versace",
category:"Perfume",
price:280000,
image:"images/eros.jpg"
},

/* LIPSTICKS */

{
id:5,
name:"Ruby Woo",
brand:"MAC",
category:"Lipstick",
price:40000,
image:"images/ruby-woo.jpg"
},

{
id:6,
name:"Velvet Teddy",
brand:"MAC",
category:"Lipstick",
price:42000,
image:"images/velvet-teddy.jpg"
},

/* LIPGLOSS */

{
id:7,
name:"Gloss Bomb",
brand:"Fenty Beauty",
category:"Lipgloss",
price:35000,
image:"images/gloss-bomb.jpg"
},

{
id:8,
name:"Butter Gloss",
brand:"NYX",
category:"Lipgloss",
price:25000,
image:"images/butter-gloss.jpg"
},

/* WIGS */

{
id:9,
name:"Brazilian Wig",
brand:"Premium Hair",
category:"Wig",
price:250000,
image:"images/brazilian-wig.jpg"
},

{
id:10,
name:"Curly Lace Wig",
brand:"Luxury Hair",
category:"Wig",
price:320000,
image:"images/curly-lace-wig.jpg"
},

/* BAGS */

{
id:11,
name:"Luxury Leather Bag",
brand:"Gucci Style",
category:"Bag",
price:150000,
image:"images/luxury-leather-bag.jpg"
},

{
id:12,
name:"Mini Handbag",
brand:"LV Style",
category:"Bag",
price:120000,
image:"images/mini-handbag.jpg"
}

];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart",JSON.stringify(cart));
}

function show(){

let d=document.getElementById("products");

let f=document.getElementById("filter").value;

let s=document.getElementById("search").value.toLowerCase();

d.innerHTML="";

products
.filter(p =>
(f==="All" || p.category===f) &&
p.name.toLowerCase().includes(s)
)

.forEach(p=>{

d.innerHTML += `

<div class="card">

<img src="${p.image}" class="product-image">

<h3>${p.name}</h3>

<p>${p.brand}</p>

<p>${p.category}</p>

<p>UGX ${p.price}</p>

<button onclick="add(${p.id})">
Add to Cart
</button>

</div>

`;

});

}

function add(pid){

let item=products.find(p=>p.id===pid);

let exist=cart.find(x=>x.id===pid);

if(exist){
exist.qty++;
}else{
cart.push({...item,qty:1});
}

saveCart();

render();

/* SUCCESS POPUP */

let popup=document.createElement("div");

popup.innerText=`${item.name} added to cart`;

popup.style.position="fixed";
popup.style.bottom="90px";
popup.style.right="20px";
popup.style.background="gold";
popup.style.color="black";
popup.style.padding="14px 20px";
popup.style.borderRadius="12px";
popup.style.fontWeight="bold";
popup.style.boxShadow="0 5px 20px rgba(255,215,0,0.5)";
popup.style.zIndex="9999";
popup.style.opacity="0";
popup.style.transform="translateY(20px)";
popup.style.transition="all 0.4s ease";

document.body.appendChild(popup);

setTimeout(()=>{
popup.style.opacity="1";
popup.style.transform="translateY(0)";
},100);

setTimeout(()=>{
popup.style.opacity="0";
popup.style.transform="translateY(20px)";
},2200);

setTimeout(()=>{
popup.remove();
},2700);

}

function render(){

let c=document.getElementById("cart");

let total=0;

c.innerHTML="";

cart.forEach((i,idx)=>{

total+=i.price*i.qty;

c.innerHTML+=`

${i.name} x${i.qty} = UGX ${i.price*i.qty}

<button onclick="removeItem(${idx})">❌</button><br>

`;

});

document.getElementById("total").innerText="Total UGX "+total;

}

function removeItem(i){

cart.splice(i,1);

saveCart();

render();

}

function checkout(){

if(cart.length===0)
return alert("Cart empty");

let name=document.getElementById("name").value;

let phone=document.getElementById("phone").value;

let location=document.getElementById("location").value;

if(!name||!phone||!location)
return alert("Fill all details");

if(!confirm("Proceed with Mobile Money payment?"))
return;

let order={

name,
phone,
location,

items:cart,

total:cart.reduce((t,i)=>t+i.price*i.qty,0),

date:new Date().toLocaleString()

};

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

orders.push(order);

localStorage.setItem("orders",JSON.stringify(orders));

alert("Payment Successful (Simulation)");

cart=[];

saveCart();

render();

}

function whatsapp(){

let msg="Hello, I want to order:%0A";

cart.forEach(i=>{

msg+=`${i.name} x${i.qty}%0A`;

});

msg+=`Total: UGX ${cart.reduce((t,i)=>t+i.price*i.qty,0)}`;

window.open(`https://wa.me/256773325540?text=${msg}`);

}

function loadOrders(){

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

let o=document.getElementById("orders");

o.innerHTML="";

orders.forEach(x=>{

o.innerHTML+=`

<div class="orderBox">

<b>${x.name}</b><br>

${x.phone}<br>

${x.location}<br>

${x.date}<br>

<b>Total: UGX ${x.total}</b>

</div>

`;

});

}

function scrollToCart(){

document.getElementById("cart").scrollIntoView({
behavior:"smooth"
});

}

document.getElementById("search").oninput=show;

document.getElementById("filter").onchange=show;

show();

render();

loadOrders();

</script>

</body>
</html>
