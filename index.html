<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE WADES FRAGRANCES</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #0a0a0a 70%);
  color: #f5f5f5;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: linear-gradient(135deg, #000, #1a1a1a, #2b2b2b);
  text-align: center;
  padding: 35px 20px;
  border-bottom: 2px solid gold;
  box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
}

header h1 {
  font-size: 52px;
  letter-spacing: 4px;
  margin: 0;

  background: linear-gradient(90deg, #FFD700, #fff3b0, #FFD700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 8px rgba(255,215,0,0.6),
    0 0 18px rgba(255,215,0,0.5),
    0 0 28px rgba(255,215,0,0.4);

  animation: glowPulse 2.5s infinite ease-in-out;
}

@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 0 10px gold); }
  50% { filter: drop-shadow(0 0 22px gold); }
}

header p {
  margin-top: 8px;
  color: #ccc;
  letter-spacing: 2px;
}

.container { padding: 20px; }

input, select {
  padding: 12px;
  margin: 5px;
  border-radius: 25px;
  border: none;
  background: #1c1c1c;
  color: white;
  outline: none;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid rgba(255,215,0,0.2);
  transition: 0.3s;
  animation: fadeIn 0.4s ease;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(255,215,0,0.25);
}

.card h3 { color: gold; }

@keyframes fadeIn {
  from {opacity:0; transform: translateY(15px);}
  to {opacity:1; transform: translateY(0);}
}

/* BUTTONS */
button {
  background: linear-gradient(90deg, gold, #ffd700);
  color: black;
  border: none;
  padding: 10px;
  border-radius: 25px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  font-weight: bold;
}

button:hover { transform: scale(1.03); }

/* CART */
.cart {
  margin-top: 30px;
  padding: 20px;
  background: #1a1a1a;
  border-radius: 15px;
  border: 1px solid rgba(255,215,0,0.3);
}

/* ADMIN */
.admin {
  margin-top: 40px;
  background: #111;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid gold;
}

.orderBox {
  border: 1px solid rgba(255,215,0,0.3);
  padding: 10px;
  margin-top: 10px;
}

/* FLOATING CART */
.floating-cart {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: gold;
  color: black;
  padding: 15px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(255,215,0,0.5);
}

footer {
  text-align: center;
  padding: 20px;
  border-top: 1px solid gold;
  margin-top: 40px;
}
</style>
</head>

<body>

<header>
  <h1>THE WADES FRAGRANCES</h1>
  <p>Luxury Beauty • Elegance • Style</p>
</header>

<div class="container">

<input id="search" placeholder="Search products...">

<select id="filter">
<option>All</option>
<option>Perfume</option>
<option>Wig</option>
<option>Bag</option>
<option>Lipstick</option>
<option>Lipgloss</option>
</select>

<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 Cart</h2>
<div id="cart"></div>
<h3 id="total"></h3>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="location" placeholder="Delivery Location">

<button onclick="checkout()">Checkout (Mobile Money Simulation)</button>
<button onclick="whatsapp()">Order via WhatsApp</button>
</div>

<div class="admin">
<h2>📦 Admin Orders</h2>
<button onclick="loadOrders()">Refresh Orders</button>
<div id="orders"></div>
</div>

</div>

<div class="floating-cart" onclick="scrollToCart()">🛒</div>

<script>

/* =========================
   FULL PRODUCT CATALOGUE
   (ONLY CHANGE MADE)
========================= */

const perfumes = [
["Khamrah Qahwah","Lattafa",120000],["Khamrah","Lattafa",110000],
["Asad Bourbon","Lattafa",100000],["9PM Elixir","Afnan",130000],
["Stronger With You","Armani",250000],["Oud Mood","Lattafa",90000],
["Badee Al Oud","Lattafa",115000],["Club De Nuit Intense","Armaf",150000],
["Eros","Versace",280000],["Sauvage","Dior",320000],
["Bleu de Chanel","Chanel",350000],["Y Eau de Parfum","YSL",300000],
["Invictus","Paco Rabanne",270000],["1 Million","Paco Rabanne",260000],
["Hawas","Rasasi",140000],["Amber Oud Gold","Al Haramain",200000],
["Oud for Glory","Lattafa",130000],["Velvet Oud","Lattafa",100000],
["Cool Water","Davidoff",180000],["Versace Dylan Blue","Versace",240000],
["Black Opium","YSL",310000],["Acqua Di Gio","Armani",290000],
["Tom Ford Noir","Tom Ford",400000],["Tom Ford Oud Wood","Tom Ford",450000],
["Bentley Intense","Bentley",160000],["Aventus","Creed",600000],
["Explorer","Montblanc",180000],["Le Male","Jean Paul Gaultier",220000],
["Ultra Male","Jean Paul Gaultier",240000],["Dior Homme","Dior",300000]
];

const lipsticks = [
["Ruby Woo","MAC",40000],["Velvet Teddy","MAC",42000],
["Power Bullet","Huda Beauty",45000],["SuperStay Matte","Maybelline",25000],
["Soft Matte","NYX",30000],["Chili","MAC",40000],
["Diva","MAC",42000],["Rebel","MAC",45000],
["Nude Beige","Huda Beauty",43000],["Brown Sugar","Huda Beauty",44000]
];

const lipgloss = [
["Gloss Bomb","Fenty Beauty",35000],["Lifter Gloss","Maybelline",28000],
["Butter Gloss","NYX",25000],["Shimmer Gloss","Beauty Line",20000],
["Clear Shine","Fenty Beauty",36000],["Pink Glow","NYX",27000],
["Honey Gloss","Maybelline",29000],["Caramel Shine","Beauty Line",24000]
];

const wigs = [
["Brazilian Wig","Premium Hair",250000],["Peruvian Wig","Premium Hair",260000],
["Synthetic Wig","Beauty Line",120000],["Straight Lace Wig","Luxury Hair",300000],
["Body Wave Wig","Premium Hair",280000],["Curly Lace Wig","Luxury Hair",320000],
["Blonde Highlight Wig","Luxury Hair",350000],["Bob Cut Wig","Beauty Line",150000]
];

const bags = [
["Luxury Leather Bag","Gucci Style",150000],["Classic Tote","Zara Style",90000],
["Mini Handbag","LV Style",120000],["Office Bag","MK Style",140000],
["Designer Shoulder Bag","Gucci Style",220000],
["Elegant Handbag","Zara Style",110000],
["Premium Crossbody","LV Style",180000],
["Luxury Travel Bag","Gucci Style",300000]
];

/* =========================
   SYSTEM (UNCHANGED LOGIC)
========================= */

let products=[];
let id=0;

function expand(list, category){
list.forEach(p=>{
for(let i=1;i<=6;i++){
products.push({
id:id++,
name:p[0]+" "+i,
category:category,
price:p[2]
});
}
});
}

expand(perfumes,"Perfume");
expand(lipsticks,"Lipstick");
expand(lipgloss,"Lipgloss");
expand(wigs,"Wig");
expand(bags,"Bag");

let cart=JSON.parse(localStorage.getItem("cart"))||[];

function saveCart(){
localStorage.setItem("cart",JSON.stringify(cart));
}

function show(){
let d=document.getElementById("products");
let f=document.getElementById("filter").value;
let s=document.getElementById("search").value.toLowerCase();

d.innerHTML="";

products.filter(p=>
(f==="All"||p.category===f)&&p.name.toLowerCase().includes(s)
).forEach(p=>{
d.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
<p>${p.category}</p>
<p>UGX ${p.price}</p>
<button onclick="add(${p.id})">Add to Cart</button>
</div>`;
});
}

function add(pid){
let item=products.find(p=>p.id===pid);
let exist=cart.find(x=>x.id===pid);

if(exist){exist.qty++;}else{cart.push({...item,qty:1});}

saveCart();
render();
}

function render(){
let c=document.getElementById("cart");
let total=0;
c.innerHTML="";

cart.forEach((i,idx)=>{
total+=i.price*i.qty;

c.innerHTML+=`
${i.name} x${i.qty} = UGX ${i.price*i.qty}
<button onclick="removeItem(${idx})">❌</button><br>
`;
});

document.getElementById("total").innerText="Total UGX "+total;
}

function removeItem(i){
cart.splice(i,1);
saveCart();
render();
}

function checkout(){
if(cart.length===0)return alert("Cart empty");

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let location=document.getElementById("location").value;

if(!name||!phone||!location)return alert("Fill all details");

if(!confirm("Proceed with Mobile Money payment?"))return;

let order={
name,phone,location,
items:cart,
total:cart.reduce((t,i)=>t+i.price*i.qty,0),
date:new Date().toLocaleString()
};

let orders=JSON.parse(localStorage.getItem("orders")||"[]");
orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));

alert("Payment Successful (Simulation)");

cart=[];
saveCart();
render();
}

function whatsapp(){
let msg="Hello, I want to order:%0A";

cart.forEach(i=>{
msg+=`${i.name} x${i.qty}%0A`;
});

msg+=`Total: UGX ${cart.reduce((t,i)=>t+i.price*i.qty,0)}`;

window.open(`https://wa.me/256775771714?text=${msg}`);
}

function loadOrders(){
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
let o=document.getElementById("orders");
o.innerHTML="";

orders.forEach(x=>{
o.innerHTML+=`
<div class="orderBox">
<b>${x.name}</b><br>
${x.phone}<br>
${x.location}<br>
${x.date}<br>
<b>Total: UGX ${x.total}</b>
</div>`;
});
}

function scrollToCart(){
document.getElementById("cart").scrollIntoView({behavior:"smooth"});
}

document.getElementById("search").oninput=show;
document.getElementById("filter").onchange=show;

show();
render();
loadOrders();

</script>

</body>
</html>
